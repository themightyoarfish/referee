name: macOS app

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: macos-app
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Referee.app
        run: ./build-app.sh

      - name: Zip app bundle
        run: ditto -c -k --sequesterRsrc --keepParent build/macos/Referee.app build/macos/Referee.app.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Referee-macos
          path: build/macos/Referee.app.zip

      - uses: actions/upload-artifact@v4
        with:
          name: referee-emergency-cleanup
          path: packaging/macos/cleanup-stale-referee.sh
