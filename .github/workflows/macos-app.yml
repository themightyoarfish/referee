name: macOS app

on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - 'server/**'
      - 'build-app.sh'
      - 'packaging/**'
      - '.github/workflows/macos-app.yml'
  workflow_dispatch:

concurrency:
  group: macos-app
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Referee.app
        run: ./build-app.sh

      - name: Zip app bundle
        run: ditto -c -k --sequesterRsrc --keepParent build/macos/Referee.app build/macos/Referee.app.zip

      # Pre-zipped with ditto; archive: false avoids GitHub wrapping it in a second zip
      # (default upload-artifact behavior — fine for folders, confusing for .zip downloads).
      - uses: actions/upload-artifact@v7
        with:
          path: build/macos/Referee.app.zip
          archive: false

      - uses: actions/upload-artifact@v7
        with:
          name: referee-emergency-cleanup
          path: packaging/macos/cleanup-stale-referee.sh
